<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="32" height="32" fill="none" shape-rendering="crispEdges">
  <rect width="16" height="16" rx="4" fill="#000000"/>
  <!-- Centered pixel key inside 16x16 canvas -->
  <!-- Key is 4 units wide, 9 units tall. Offset: x=6, y=3 -->
  <g fill="#FFFFFF">
    <!-- Row 0 (y=3): cols 0, 3 -> x=6, 9 -->
    <rect x="6" y="3" width="1" height="1"/>
    <rect x="9" y="3" width="1" height="1"/>
    <!-- Row 1 (y=4): cols 0, 3 -> x=6, 9 -->
    <rect x="6" y="4" width="1" height="1"/>
    <rect x="9" y="4" width="1" height="1"/>
    <!-- Row 2 (y=5): cols 1, 2 -> x=7, 8 -->
    <rect x="7" y="5" width="2" height="1"/>
    <!-- Rows 3-6 (y=6..9): cols 1, 2 -> x=7, 8 -->
    <rect x="7" y="6" width="2" height="4"/>
    <!-- Row 7 (y=10): col 0 -> x=6 -->
    <rect x="6" y="10" width="1" height="1"/>
    <!-- Row 8 (y=11): col 1 -> x=7 -->
    <rect x="7" y="11" width="1" height="1"/>
  </g>
</svg>
